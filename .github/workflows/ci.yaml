name: CI

on: push

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: check out the code
        uses: actions/checkout@v4

      - name: set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install the dependencies
        run: npm ci

      - name: run tests
        run: npm test